<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Английский сразу — карточки</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111;min-height:100vh}
  .wrap{position:fixed;left:0;right:0;top:0;max-width:520px;margin:0 auto;padding:8px 10px;height:var(--vh,100dvh);display:flex;flex-direction:column}
  html,body{overflow:hidden;height:100%}
  #study{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #practice{flex:1;min-height:0;display:flex;flex-direction:column}
  body.kb .tabs,body.kb .hint,body.kb .foot,body.kb .stats,body.kb .bar{display:none}
  .tabs,.stats,.bar,form,.row,#res{flex:none}
  .tabs{display:flex;gap:8px;margin-bottom:6px}
  .tabs button{flex:1;padding:8px;border:0;border-radius:10px;background:#e5e7eb;font-size:15px;cursor:pointer}
  .tabs button.on{background:#2563eb;color:#fff}
  .stats{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-bottom:8px}
  .bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-bottom:12px}
  .bar i{display:block;height:100%;background:#16a34a;width:0}
  .stage{position:relative;flex:1;min-height:0;display:flex;touch-action:pan-y}
  .card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:8px;user-select:none;position:relative;transition:transform .25s,opacity .25s}
  .card.drag{transition:none}
  .card img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:10px;display:block;pointer-events:none}
  .card .ru-front{font-size:26px;font-weight:600;text-align:center;padding:50px 10px}
  .badge{position:absolute;top:24px;font-size:22px;font-weight:700;padding:4px 12px;border:3px solid;border-radius:8px;opacity:0;background:#fffc}
  .badge.r{left:24px;color:#16a34a;border-color:#16a34a;transform:rotate(-12deg)}
  .badge.l{right:24px;color:#dc2626;border-color:#dc2626;transform:rotate(12deg)}
  .answer{flex:none;margin-top:6px;text-align:center}
  .answer .en{font-size:19px;font-weight:700}
  .answer .ru{font-size:15px;color:#444;margin-top:4px}
  .result{margin-top:6px;padding:6px;border-radius:8px;text-align:center;font-weight:600}
  .ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.near{background:#fef9c3;color:#854d0e}
  form{display:flex;gap:8px;margin-top:8px}
  input[type=text]{flex:1;padding:11px;font-size:16px;border:2px solid #d1d5db;border-radius:10px;min-width:0}
  input[type=text]:focus{outline:none;border-color:#2563eb}
  .btn{padding:11px 14px;border:0;border-radius:10px;font-size:16px;cursor:pointer;background:#2563eb;color:#fff}
  .btn.sec{background:#e5e7eb;color:#111}
  .row{display:flex;gap:8px;margin-top:6px}
  .row .btn{flex:1}
  .row .no{background:#dc2626}.row .yes{background:#16a34a}
  .hint{font-size:12px;color:#777;text-align:center;margin-top:6px}
  .modes button{background:#d1fae5}
  .modes button.on{background:#16a34a;color:#fff}
  #study table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  #study td{padding:10px 12px;border-bottom:1px solid #eee;font-size:16px;vertical-align:top}
  #study td:first-child{font-weight:600;width:50%}
  #study td:last-child{color:#444}
  #study .n{color:#999;font-weight:400;margin-right:6px}
  #study h3{margin:4px 0 10px;font-size:17px}
  .tabs:not(.modes) button{font-size:14px;padding:8px 4px}
  .card.dlg{padding:0;overflow:hidden;cursor:pointer;background:#1f2937}
  .card.dlg img{object-fit:cover;border-radius:0}
  .plate{position:absolute;left:0;right:0;bottom:0;background:rgba(17,24,39,.88);color:#fff;padding:12px 14px;font-size:17px;line-height:1.4}

  .plate .ru-l.small{font-size:14px;color:#cbd5e1;margin-top:6px}
  .foot{margin-top:6px;text-align:center}
  .foot button{background:none;border:0;color:#888;text-decoration:underline;cursor:pointer;font-size:13px}

function norm(s){
  return s.toLowerCase().replace(/ё/g,'е').replace(/[’‘`´]/g,"'")
    .replace(/[^a-zа-я0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const d = Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
// варианты ответа: "Подними / возьми телефон." -> "подними телефон", "возьми телефон"
function variants(text){
  const t = text.replace(/\.$/,'');
  const parts = t.split('/').map(s=>s.trim());
  if(parts.length===1) return [norm(t)];
  const words = parts.map(p=>p.split(' '));
  const tail = words[words.length-1].slice(1).join(' ');
  const out = new Set(parts.map(p=>norm(p)));
  parts.forEach((p,i)=>{ if(i<parts.length-1 && p.split(' ').length===1) out.add(norm(p+' '+tail)); });
  return [...out];
}
function check(input, c){
  const cyr = /[а-яё]/i.test(input);
  const vs = cyr ? variants(c.ru) : [norm(c.en)];
  const n = norm(input);
  if(!n) return 'empty';
  if(vs.includes(n)) return 'ok';
  // допускаем отсутствие артиклей/лишний пробел — и 1 опечатку в длинных фразах
  const best = Math.min(...vs.map(v=>lev(n,v)));
  if(best <= (n.length > 12 ? 2 : 1)) return 'near';
  return 'bad';
}

function canon(s){

  CONTR.forEach(([r,t])=>{ s = s.replace(r,t); });
  s = ' '+s.replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim()+' ';
  SYN.forEach(([a,b])=>{ s = s.split(' '+a+' ').join(' '+b+' '); s = s.split(' '+a+' ').join(' '+b+' '); });
  return s.trim().split(' ').filter(w=>w && !FILLER.has(w));
}
const wEq = (a,b)=> a===b || (a.length>3 && b.length>3 && lev(a,b)<=1);
// LCS по словам; возвращает длину и какие слова эталона совпали
function lcs(a,b){
  const d = Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = wEq(a[i-1],b[j-1]) ? d[i-1][j-1]+1 : Math.max(d[i-1][j],d[i][j-1]);
  return d[a.length][b.length];
}
function combos(c){
  let out = [[]];
  c.lines.forEach((l,i)=>{
    const opts = [l, ...((c.alt||[])[i]||[])];
    const nx = []; out.forEach(p=>opts.forEach(o=>nx.push([...p,o]))); out = nx.slice(0,400);
  });
  return out.map(p=>p.join(' '));
}
function checkDialog(input, c){
  if(!input.trim()) return {r:'empty'};
  if(/[а-яё]/i.test(input)) return {r:'cyr'};
  const a = canon(input);
  let best = 0;
  combos(c).forEach(v=>{ const b = canon(v); const s = lcs(a,b) / Math.max(a.length,b.length); if(s>best) best=s; });
  const r = best>=0.93 ? 'ok' : best>=0.75 ? 'sense' : best>=0.5 ? 'near' : 'bad';
  return {r, score: Math.round(best*100)};
}

function pick(){
  const n = deck().length;
  let total = 0; const ws = [];
  for(let i=0;i<n;i++){ const w = i===last ? 0 : WEIGHTS[box(i)]; ws.push(w); total += w; }
  let r = Math.random()*total;
  for(let i=0;i<n;i++){ r -= ws[i]; if(r<=0) return i; }
  return (last+1)%n;
}

function render(){
  const c = deck()[cur];
  const card = $('card');
  card.className = 'card'; card.style.transform=''; card.style.opacity=1;
  $('inp').placeholder = DECKS[deckId].dialog ? 'Напиши диалог по-английски…' : 'Напиши по-английски или по-русски…';
  if(DECKS[deckId].dialog){
    card.className = 'card dlg';
    card.innerHTML =
      '<div class="badge r" id="bR">ЗАПОМНИЛ</div><div class="badge l" id="bL">ЕЩЁ РАЗ</div>' +
      `<img src="${c.img}" alt="">` +
      '<div class="plate" id="plate"><div class="tap">👆 Нажми на карточку — подсказка на русском</div></div>';
    revealed = false; hintOn = false;
    $('res').innerHTML = '';
    $('inp').value = ''; $('inp').disabled = false;
    $('go').textContent = 'Проверить';
    $('inp').focus({preventScroll:true});
    stats(); return;
  }
  card.innerHTML =
    '<div class="badge r" id="bR">ЗАПОМНИЛ</div><div class="badge l" id="bL">ЕЩЁ РАЗ</div>' +
    (c.img ? `<img src="${c.img}" alt="">` : `<div class="ru-front">${c.ru}</div>`) +
    '<div class="answer" id="ans"></div>';
  revealed = false;
  $('res').innerHTML = '';
  $('inp').value = ''; $('inp').disabled = false;
  $('go').textContent = 'Проверить';
  $('inp').focus({preventScroll:true});
  stats();
}
let hintOn = false;
function toggleHint(){
  if(!DECKS[deckId].dialog || revealed) return;
  const c = deck()[cur];
  hintOn = !hintOn;
  $('plate').innerHTML = hintOn
    ? '<div class="ru-l">' + c.ru.map(l=>'– '+l).join('<br>') + '</div>'
    : '<div class="tap">👆 Нажми на карточку — подсказка на русском</div>';
}
function reveal(){
  const c = deck()[cur];
  revealed = true;
  if(DECKS[deckId].dialog){
    $('plate').innerHTML = '<div class="en-l">' + c.lines.map(l=>'– '+l).join('<br>') + '</div>' +
      '<div class="ru-l small">' + c.ru.map(l=>'– '+l).join('<br>') + '</div>';
    return;
  }
  $('ans').innerHTML = `<div class="en">${c.en}</div>` + (c.img ? `<div class="ru">${c.ru}</div>` : '');
}
function stats(){
  const n = deck().length;
  let known = 0, hard = 0;
  for(let i=0;i<n;i++){ if(box(i)>=3) known++; else if(i in progress) hard++; }
  $('st-known').textContent = `Выучено: ${known} из ${n}`;
  $('st-hard').textContent = `Трудных: ${hard}`;
  $('bar').style.width = (known/n*100)+'%';
}

$('form').addEventListener('submit', e=>{
  e.preventDefault();
  if(revealed){ $('inp').value=''; return; }   // повторный Enter ничего не делает
  const v = $('inp').value;
  if(!v.trim()){ reveal(); return; }
  if(DECKS[deckId].dialog){
    const {r, score} = checkDialog(v, deck()[cur]);
    if(r==='cyr'){ $('res').innerHTML = '<div class="result near">Здесь пиши по-английски 🙂</div>'; return; }
    reveal();
    $('res').innerHTML =
        r==='ok'    ? '<div class="result ok">✓ Верно! Свайп вправо — запомнил</div>'
      : r==='sense' ? `<div class="result ok">✓ Засчитано — по смыслу верно (${score}%). Сравни с вариантом на карточке</div>`
      : r==='near'  ? `<div class="result near">≈ Частично (${score}%) — сравни с ответом на карточке</div>`
      :               '<div class="result bad">✗ Не совпало — сравни с ответом на карточке</div>';
    $('go').textContent = 'Показано';
    return;
  }
  const r = check(v, deck()[cur]);
  reveal();
  $('res').innerHTML = r==='ok' ? '<div class="result ok">✓ Верно! Свайп вправо — запомнил</div>'
    : r==='near' ? '<div class="result near">≈ Почти верно (небольшая опечатка)</div>'
    : '<div class="result bad">✗ Не совпало — сравни с ответом выше</div>';
  $('go').textContent = 'Показано';
});

function answer(knew){
  const card = $('card');
  progress[cur] = knew ? Math.min(MAXBOX, box(cur)+1) : 0;
  save();
  card.style.transform = `translateX(${knew?500:-500}px) rotate(${knew?20:-20}deg)`;
  card.style.opacity = 0;
  last = cur;
  setTimeout(()=>{ cur = pick(); render(); }, 220);
}
$('know').onclick = ()=>answer(true);
$('again').onclick = ()=>answer(false);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' && (e.ctrlKey || document.activeElement!==$('inp') || !$('inp').value)) { e.preventDefault(); answer(true); }
  if(e.key==='ArrowLeft'  && (e.ctrlKey || document.activeElement!==$('inp') || !$('inp').value)) { e.preventDefault(); answer(false); }
});

// свайп
(function(){
  const card = $('card'); let x0=null, dx=0;
  card.addEventListener('pointerdown', e=>{ x0=e.clientX; dx=0; card.classList.add('drag'); card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove', e=>{
    if(x0===null) return;
    dx = e.clientX-x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    const bR=$('bR'), bL=$('bL');
    if(bR) bR.style.opacity = Math.max(0, Math.min(1, dx/100));
    if(bL) bL.style.opacity = Math.max(0, Math.min(1, -dx/100));
  });
  const end = ()=>{
    if(x0===null) return;
    card.classList.remove('drag');
    const d = dx; x0=null;
    if(d>90) answer(true);
    else if(d<-90) answer(false);
    else { if(Math.abs(d)<6) toggleHint(); card.style.transform=''; const bR=$('bR'),bL=$('bL'); if(bR)bR.style.opacity=0; if(bL)bL.style.opacity=0; }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
})();

let mode = localStorage.getItem('mode') || 'study';
function renderStudy(){
  $('study').innerHTML = `<h3>${DECKS[deckId].name} — ${deck().length} фраз</h3><table>` +
    deck().map((c,i)=> c.lines
      ? `<tr><td><span class="n">${i+1}.</span>${c.lines.map(l=>'– '+l).join('<br>')}</td><td>${c.ru.map(l=>'– '+l).join('<br>')}</td></tr>`
      : `<tr><td><span class="n">${i+1}.</span>${c.en}</td><td>${c.ru}</td></tr>`).join('') + '</table>' +
    '<div class="hint">Прочитай список, затем переходи в «Тренировку» — там будут картинки.</div>';
}
function setMode(m){
  mode = m; localStorage.setItem('mode', m);
  $('m1').classList.toggle('on', m==='study'); $('m2').classList.toggle('on', m==='practice');
  $('study').style.display = m==='study' ? '' : 'none';
  $('practice').style.display = m==='practice' ? '' : 'none';
  if(m==='practice') $('inp').focus({preventScroll:true});
}
$('m1').onclick = ()=>setMode('study');
$('m2').onclick = ()=>setMode('practice');

function setDeck(id){
  deckId = id; localStorage.setItem('deck', id);
  [1,2,3].forEach(n=>$('t'+n).classList.toggle('on', id===n));
  load(); last = -1; cur = pick(); render(); renderStudy(); setMode(mode);
}
$('t1').onclick = ()=>setDeck(1);
$('t2').onclick = ()=>setDeck(2);
$('t3').onclick = ()=>setDeck(3);
$('reset').onclick = ()=>{ if(confirm('Сбросить прогресс этого раздела?')){ progress={}; save(); last=-1; cur=pick(); render(); } };

// подгон под экран с клавиатурой (мобильные)
function fit(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  const r = document.documentElement.style;
  r.setProperty('--vh', h+'px');
  document.querySelector('.wrap').style.top = top+'px';
}
if(window.visualViewport){ visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
window.addEventListener('resize', fit);
fit();
$('inp').addEventListener('focus', ()=>document.body.classList.add('kb'));
$('inp').addEventListener('blur',  ()=>document.body.classList.remove('kb'));
// кнопки не должны забирать фокус у поля ввода (иначе клавиатура мигает)
document.querySelectorAll('#go,#know,#again').forEach(b=>b.addEventListener('mousedown', e=>e.preventDefault()));

setDeck(deckId);
</script>
</body>
